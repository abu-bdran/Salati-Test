name: salati
description: "صلاتي - تطبيق احترافي لمواقيت الصلاة"
publish_to: 'none'
version: 1.0.1+2
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  adhan: ^2.0.0+1
  intl: ^0.20.2
  hijri: ^3.0.0
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  dio: ^5.8.0+1
  flutter_local_notifications: ^19.5.0
  flutter_compass_v3: ^1.0.0
  geomag: ^0.3.0
  audioplayers: 6.3.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  path_provider: ^2.1.5
  webview_flutter: ^4.13.1
  qvp_flutter: ^0.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/qibla_arrival.mp3
    - assets/branding/salati_icon.png
    - assets/branding/salati_logo.png
    - assets/quran/pages/
